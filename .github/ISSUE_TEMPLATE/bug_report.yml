name: Bug report
description: Report a reproducible TokenBurn problem
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, prompts, transcripts, emails, account IDs, full local paths, or unredacted logs.
  - type: input
    id: version
    attributes:
      label: TokenBurn version or commit
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Provider or surface
      placeholder: Codex, Claude Code, taskbar, tray, Tauri popup, CLI
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: List the smallest safe steps using synthetic data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Checks already tried
