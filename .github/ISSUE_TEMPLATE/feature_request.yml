name: Feature request
description: Suggest a focused improvement to TokenBurn
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the smallest useful behavior.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Privacy and platform impact
      description: What local data, provider calls, Windows surfaces, or release behavior would change?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
