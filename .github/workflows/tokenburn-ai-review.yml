name: TokenBurn AI review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: tokenburn-ai-review-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event_name == 'pull_request_target' || (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && (github.event.comment.body == '/tokenburn-review' || startsWith(github.event.comment.body, '/tokenburn-review ')))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Job-level scope is required because the Tailscale step's condition is evaluated
      # before step-level environment variables exist.
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
    steps:
      - name: Checkout trusted base repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Install pinned Open Code Review
        run: npm install --global @alibaba-group/open-code-review@1.7.1
      - name: Connect to private review gateway when configured
        if: env.TAILSCALE_AUTHKEY != ''
        uses: tailscale/github-action@v2
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
      - name: Verify review gateway reachability
        env:
          CLIPROXY_API_KEY: ${{ secrets.CLIPROXY_API_KEY }}
          CLIPROXY_URL: ${{ secrets.CLIPROXY_URL }}
        run: |
          code=$(curl -s -o /tmp/models.json -w '%{http_code}' -H "Authorization: Bearer ${CLIPROXY_API_KEY}" "${CLIPROXY_URL%/}/models" || true)
          echo "gateway /models HTTP status: ${code}"
          head -c 300 /tmp/models.json || true
      - name: Run TokenBurn AI review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLIPROXY_API_KEY: ${{ secrets.CLIPROXY_API_KEY }}
          CLIPROXY_URL: ${{ secrets.CLIPROXY_URL }}
          CLIPROXY_MODEL: ${{ secrets.CLIPROXY_MODEL }}
          CLIPROXY_FALLBACK_MODEL: ${{ secrets.CLIPROXY_FALLBACK_MODEL }}
        run: node scripts/tokenburn-ai-review.mjs
